name: ViewFans
options:
  bundleIdPrefix: com.chen329
  deploymentTarget:
    iOS: "17.0"
targets:
  ViewFans:
    type: application
    platform: iOS
    sources: [Sources]
    entitlements:
      path: ViewFans.entitlements
      properties:
        com.apple.security.application-groups: [group.com.chen329.viewfans]
    dependencies:
      - target: ViewFansShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chen329.viewfans
        TARGETED_DEVICE_FAMILY: "2"
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "自宅サーバーの画像を表示するために使います"
        INFOPLIST_KEY_CFBundleDisplayName: "View Fans"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "送信した写真を写真アプリから削除するために使います"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "10"
  ViewFansShare:
    type: app-extension
    platform: iOS
    sources:
      - Share
      - Sources/API.swift
      - Sources/Models.swift
      - Sources/Upload.swift
      - Sources/FolderPicker.swift
    entitlements:
      path: Share/ViewFansShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.chen329.viewfans]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: "View Fans"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: ViewFansShare.ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 500
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chen329.viewfans.share
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "10"
