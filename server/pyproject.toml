[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "viewfans"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pillow",
    "pillow-heif",
    "python-multipart",
]

[project.scripts]
viewfans = "viewfans.cli:main"

[tool.setuptools]
packages = ["viewfans"]

[tool.setuptools.package-data]
viewfans = ["web/*"]
