<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<title>View Fans</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="login" hidden>
  <form id="login-form">
    <h1>View Fans</h1>
    <input id="token" type="password" placeholder="トークン" autocomplete="current-password" autocapitalize="off">
    <button type="submit">ログイン</button>
    <p id="login-error" class="error"></p>
  </form>
</div>

<div id="app" hidden>
  <header>
    <button id="back" class="icon" title="戻る">‹</button>
    <h1 id="title">View Fans</h1>
    <div class="tools">
      <label class="cols" title="列数">
        <button id="cols-minus" class="icon">−</button>
        <input id="cols" type="range" min="1" max="20" step="1">
        <button id="cols-plus" class="icon">＋</button>
      </label>
      <button id="upload-btn" title="アップロード">アップロード</button>
      <button id="select-btn">選択</button>
      <button id="logout" title="ログアウト">ログアウト</button>
    </div>
  </header>
  <div id="selectbar" hidden>
    <span id="sel-count">0 枚を選択</span>
    <button id="sel-all">すべて選択</button>
    <button id="sel-download">ダウンロード</button>
    <button id="sel-done">完了</button>
  </div>
  <div id="progress" hidden><div id="progress-bar"></div><span id="progress-text"></span></div>
  <main id="grid"></main>
  <p id="empty" hidden>空のフォルダ</p>
  <input id="file" type="file" accept="image/*" multiple hidden>
  <div id="drop" hidden>ここにドロップしてアップロード</div>
</div>

<div id="viewer" hidden>
  <img id="viewer-img" alt="">
  <div class="viewer-bar">
    <button id="v-close" class="icon">×</button>
    <span id="v-count"></span>
    <a id="v-download" class="button">ダウンロード</a>
  </div>
  <button id="v-prev" class="nav icon">‹</button>
  <button id="v-next" class="nav icon">›</button>
</div>

<form id="zip-form" method="post" action="/api/items/zip" hidden>
  <input type="hidden" name="ids">
  <input type="hidden" name="name">
</form>
<script src="app.js"></script>
</body>
</html>
